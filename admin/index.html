<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KAPP Admin Login</title>
    <link rel="stylesheet" href="./assets/admin.css" />
  </head>
  <body>
    <main class="login">
      <form class="card" onsubmit="loginAdmin(event)">
        <h1 class="page-title">Admin 로그인</h1>
        <p class="page-subtitle">테스트 계정: admin / admin1234</p>
        <div class="grid one-column">
          <label>아이디<input id="admin-id" autocomplete="username" /></label>
          <label>비밀번호<input id="admin-pw" type="password" autocomplete="current-password" /></label>
        </div>
        <div class="actions">
          <button class="button" type="submit">로그인</button>
        </div>
      </form>
    </main>
    <script src="./assets/admin.js"></script>
  </body>
</html>
