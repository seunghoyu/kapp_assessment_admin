<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>결과 프리뷰 | KAPP Admin</title>
    <link rel="stylesheet" href="./assets/admin.css?v=20260615" />
    <style>
      .preview-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
      @media (max-width:1100px){ .preview-grid{ grid-template-columns:1fr; } }
      .kcard { border:1px solid var(--border,#e6e9ee); border-radius:12px; padding:12px 14px; margin-top:8px; }
      .kcard .h { font-weight:700; }
      .bar { height:10px; border-radius:6px; background:#EEF2FF; overflow:hidden; }
      .bar > i { display:block; height:100%; background:#4F46E5; }
      .opt { display:block; border:1px solid var(--border,#e6e9ee); border-radius:10px; padding:8px 10px; margin:6px 0; cursor:pointer; font-size:13px; }
      .opt.sel { border-color:#4F46E5; background:#EEF2FF; }
      .headline { font-size:20px; font-weight:700; margin:6px 0; }
      .muted { color:var(--muted,#667085); font-size:13px; }
      pre.design { white-space:pre-wrap; font-size:12px; background:#f8fafc; border-radius:10px; padding:12px; max-height:280px; overflow:auto; }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">KAPP Admin</div>
        <div class="account">admin 계정</div>
        <nav class="nav">
          <div class="nav-group-label">엑셀 임포트</div>
          <a href="./import.html">엑셀 임포트</a>
          <a href="./relations.html">데이터 관계도</a>
          <a class="active" href="./result-preview.html">결과 프리뷰</a>
          <div class="nav-group-label">K 영역</div>
          <a href="./k-set-manage.html">세트 · 토픽 관리</a>
          <a href="./k-question-manage.html">문항 관리</a>
          <div class="nav-group-label">A 영역</div>
          <a href="./a-question-manage.html">문항 관리</a>
          <a href="./a-type-manage.html">적성 유형 관리</a>
          <div class="nav-group-label">P 영역</div>
          <a href="./p-set-manage.html">문항 세트 관리</a>
          <a href="./p-type-manage.html">패턴 유형 관리</a>
          <div class="nav-group-label">종합 리포트</div>
          <a href="./summary-manage.html">KAP 조합 관리</a>
        </nav>
      </aside>
      <main class="main">
        <div class="page-header">
          <div>
            <h1 class="page-title">결과 프리뷰</h1>
            <p class="page-subtitle">임포트한 데이터로 K 케이스 분기 / A 유형 / P 분포 결과가 어떻게 나오는지 미리 봅니다.</p>
          </div>
          <label>직무군 <input id="jf" list="jf-list" placeholder="JF 검색/입력 (예: JF_SAL_01)" oninput="renderAll()" autocomplete="off" /><datalist id="jf-list"></datalist></label>
        </div>

        <div class="preview-grid">
          <section class="card">
            <h2>K · 케이스 분기</h2>
            <label>정답 수 (0~4): <b id="kc-val">3</b>
              <input id="kc" type="range" min="0" max="4" value="3" oninput="renderK()" style="width:100%" />
            </label>
            <div id="k-out"></div>
          </section>

          <section class="card">
            <h2>A · 적성 유형</h2>
            <label>유형 선택 <select id="a-type" onchange="renderA()"></select></label>
            <div id="a-out"></div>
          </section>
        </div>

        <section class="card" style="margin-top:16px">
          <h2>P · 실전 패턴 (선지를 골라 분포 계산)</h2>
          <div id="p-q"></div>
          <hr class="section-divider" />
          <div id="p-out"></div>
        </section>
      </main>
    </div>

    <script src="./assets/admin.js?v=20260615"></script>
    <script>
      const LS = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || d); } catch { return JSON.parse(d); } };
      const esc = (s) => String(s == null ? "" : s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      const CASE_BY_CORRECT = { 4: "E", 3: "A", 2: "B", 1: "C", 0: "D" };
      const P_LABEL = { INS: "인사이트", ANL: "분석", REL: "관계", PIO: "개척" };
      let pSel = {};

      function jfList() {
        const set = new Set();
        try { (getCodeOptions().jobFamilies || []).forEach((j) => set.add(j.jobFamilyId)); } catch {}
        ["kapp_k_sets_v1", "kapp_a_questions_v1", "kapp_p_sets_v1"].forEach((k) => LS(k, "[]").forEach((x) => x.jobFamilyId && set.add(x.jobFamilyId)));
        return [...set];
      }
      const jf = () => document.getElementById("jf").value;

      function renderK() {
        const n = +document.getElementById("kc").value;
        document.getElementById("kc-val").textContent = n;
        const cases = (LS("kapp_k_cases_v1", "{}") || {})[jf()] || [];
        const topics = LS("kapp_k_sets_v1", "[]").filter((s) => s.jobFamilyId === jf()).sort((a, b) => (a.priority || 99) - (b.priority || 99));
        const c = cases.find((x) => x.correct === n) || cases.find((x) => x.code === CASE_BY_CORRECT[n]);
        let h = "";
        if (!c) { h = `<div class="empty-state">케이스 데이터 없음</div>`; }
        else {
          h += `<div class="kcard"><div class="muted">케이스 ${esc(c.code)} · ${esc(c.ratio)}</div><div class="headline">${esc(c.headline)}</div>`;
          h += `<div class="muted">BLOCK1: ${esc((c.block1 || []).join(" / "))}</div>`;
          h += `<div class="muted">BLOCK2: ${esc((c.block2 || []).join(" / ")) || "—"}</div>`;
          h += `<div class="muted" style="margin-top:4px">액션: ${esc((c.actions || []).join(" / "))}</div></div>`;
          // 강점/보완 버킷 예시 (priority 상위 토픽)
          const strong = topics.slice(0, n);
          const weak = topics.slice(n, 4);
          h += `<div style="display:flex;gap:10px;margin-top:8px">`;
          h += `<div style="flex:1"><div style="font-weight:600;color:#166534">강점 ${strong.length}</div>${strong.map((t) => `<div class="kcard" style="margin-top:6px"><b>${esc(t.setName)}</b><div class="muted">${esc(t.topicCoreSummary)}</div></div>`).join("") || "<div class='muted'>—</div>"}</div>`;
          h += `<div style="flex:1"><div style="font-weight:600;color:#92400E">보완 ${weak.length}</div>${weak.map((t) => `<div class="kcard" style="margin-top:6px"><b>${esc(t.setName)}</b><div class="muted">${esc(t.topicCoreSummary)}</div></div>`).join("") || "<div class='muted'>—</div>"}</div>`;
          h += `</div>`;
        }
        document.getElementById("k-out").innerHTML = h;
      }

      function renderA() {
        const tName = document.getElementById("a-type").value;
        const types = LS("kapp_a_types_v1", "[]").filter((x) => x.jobFamilyId === jf());
        const t = types.find((x) => x.typeName === tName);
        let h = `<div class="kcard"><div class="headline">${esc(tName || "유형")}</div><div class="muted">${esc((t && t.jobBadge) || "")} ${t && t._needsContent ? "· <b style='color:#b45309'>콘텐츠 보강 필요</b>" : ""}</div>`;
        if (t && t.definition) h += `<div style="margin-top:6px">"${esc(t.definition)}"</div>`;
        if (t && t.domainSub) h += `<div class="muted" style="margin-top:4px">${esc(t.domainSub)}</div>`;
        h += `</div>`;
        if (t && t.strengthCards && t.strengthCards.length) {
          h += `<div style="font-weight:600;margin-top:10px">이럴 때 강해요 (재직자)</div>`;
          t.strengthCards.forEach((c) => h += `<div class="kcard" style="margin-top:6px"><b>${esc(c.title)}</b><div class="muted">${esc(c.desc)}</div></div>`);
        }
        if (t && t.similarJobs && t.similarJobs.length) h += `<div class="muted" style="margin-top:8px"><b>닮은 직업</b>: ${t.similarJobs.map(esc).join(" · ")}</div>`;
        if (t && t.unexpectedJobEmployee && t.unexpectedJobEmployee.name) h += `<div class="muted" style="margin-top:4px"><b>의외의 직업</b>: ${esc(t.unexpectedJobEmployee.name)} — ${esc(t.unexpectedJobEmployee.desc)}</div>`;
        if (t && t.growthDirectionEmployee && t.growthDirectionEmployee.title) h += `<div class="kcard" style="margin-top:8px"><b>성장방향 · ${esc(t.growthDirectionEmployee.title)}</b><div class="muted">${esc(t.growthDirectionEmployee.body)}</div><div class="muted" style="margin-top:4px">이번 주: ${esc(t.growthDirectionEmployee.weekAction)}</div></div>`;
        if (!t || (!t.definition && !t.strengthCards.length)) h += `<div class="muted" style="margin-top:8px">이 유형은 콘텐츠가 비어 있어요. (적성 유형 관리에서 보강)</div>`;
        document.getElementById("a-out").innerHTML = h;
      }

      function renderPQuestions() {
        const pQ = LS("kapp_p_questions_v1", "[]").filter((q) => q.jobFamilyId === jf()).sort((a, b) => a.qNo - b.qNo);
        let h = "";
        if (!pQ.length) h = `<div class="empty-state">P 데이터 없음</div>`;
        pQ.forEach((q) => {
          h += `<div style="margin-bottom:10px"><div style="font-weight:600">Q${q.qNo} <span class="muted">${esc(q.questionType)} · 카드 ${esc(q.card)}</span></div>`;
          (q.options || []).forEach((o, oi) => {
            const sel = pSel[q.qNo] === oi ? "sel" : "";
            h += `<label class="opt ${sel}" onclick="pPick(${q.qNo},${oi})">${esc(o.axis)} · ${esc((o.text || "").slice(0, 60))}…</label>`;
          });
          h += `</div>`;
        });
        document.getElementById("p-q").innerHTML = h;
      }
      function pPick(qNo, oi) { pSel[qNo] = oi; renderPQuestions(); renderPOut(); }

      function renderPOut() {
        const pQ = LS("kapp_p_questions_v1", "[]").filter((q) => q.jobFamilyId === jf());
        const acc = { INS: 0, ANL: 0, REL: 0, PIO: 0 };
        let answered = 0;
        pQ.forEach((q) => {
          const oi = pSel[q.qNo];
          if (oi == null || !q.options[oi]) return;
          answered++;
          ["INS", "ANL", "REL", "PIO"].forEach((ax) => acc[ax] += q.options[oi][ax]);
        });
        const total = acc.INS + acc.ANL + acc.REL + acc.PIO || 1;
        const sorted = Object.entries(acc).sort((a, b) => b[1] - a[1]);
        let h = `<div class="muted">선택 ${answered}/${pQ.length} 문항 → 유형 분포</div>`;
        sorted.forEach(([ax, v]) => {
          const pct = Math.round((v / total) * 100);
          h += `<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${P_LABEL[ax]} (${ax})</span><span>${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
        });
        if (answered) {
          const domAxis = sorted[0][0];
          h += `<div class="kcard" style="margin-top:8px"><div class="headline">${P_LABEL[domAxis]}형${sorted[1][1] ? " + " + P_LABEL[sorted[1][0]] + "형" : ""}</div><div class="muted">주유형 ${P_LABEL[domAxis]} / 보조 ${P_LABEL[sorted[1][0]]}</div></div>`;
          // 주유형의 유형 마스터(닮은 인물·상황 반응) 표시
          const pt = LS("kapp_p_types_v1", "[]").find((t) => t.jobFamilyId === jf() && t.axis === domAxis);
          if (pt && pt.actionDesc) h += `<div class="muted" style="margin-top:6px">${esc(pt.actionDesc)}</div>`;
          if (pt && pt.similarPeople && pt.similarPeople.length) {
            h += `<div style="font-weight:600;margin-top:10px">같은 패턴의 사람들</div>`;
            pt.similarPeople.forEach((p) => h += `<div class="kcard" style="margin-top:6px"><b>${esc(p.name)}</b> <span class="muted">· ${esc(p.role)} · ${esc(p.category)}</span><div class="muted">${esc(p.oneLiner)}</div><div class="muted" style="margin-top:2px">${esc(p.resemblance).replace(/\n/g, "<br/>")}</div></div>`);
          }
          if (pt && pt.situations && pt.situations.length) {
            h += `<div style="font-weight:600;margin-top:10px">상황별 반응</div>`;
            pt.situations.forEach((s) => h += `<div class="kcard" style="margin-top:6px"><b>${esc(s.name)} (${esc(s.category)})</b><div class="muted">${esc(s.choice)}</div></div>`);
          }
          if (pt && pt._needsContent) h += `<div class="muted" style="margin-top:6px"><b style="color:#b45309">이 유형은 콘텐츠 보강 필요</b> (패턴 유형 관리에서 편집)</div>`;
        }
        document.getElementById("p-out").innerHTML = h;
      }

      function renderAll() {
        // A 유형 옵션 — 등록된 적성유형 마스터 기준
        const types = LS("kapp_a_types_v1", "[]").filter((x) => x.jobFamilyId === jf()).map((x) => x.typeName);
        const list = types.length ? types : ["개척형", "완수형", "관계형", "제안형", "관리형", "전략형"];
        document.getElementById("a-type").innerHTML = list.map((t) => `<option>${t}</option>`).join("");
        pSel = {};
        renderK(); renderA(); renderPQuestions(); renderPOut();
      }

      document.addEventListener("DOMContentLoaded", () => {
        const list = jfList();
        document.getElementById("jf-list").innerHTML = list.map((j) => `<option value="${j}">`).join("");
        const jfInput = document.getElementById("jf");
        if (list.includes("JF_SAL_01")) jfInput.value = "JF_SAL_01"; else if (list.length) jfInput.value = list[0];
        renderAll();
      });
    </script>
  </body>
</html>
