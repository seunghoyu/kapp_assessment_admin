    <div class="layout">
      <aside class="sidebar">
        <div class="brand">KAPP Admin</div>
        <div class="account">admin 계정</div>
        <nav class="nav">
          <a href="./content-create.html">콘텐츠 관리 · 문항 생성</a>

      <main class="main">
        <h1 class="page-title">문항 수정</h1>
        <p class="page-subtitle">JF 기준 스킬카드 목록과 K/A/P 문항 목록을 조회합니다.</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>선택</th>
                <th>직무군 코드</th>
                <th>직무군명</th>
                <th>카테고리</th>
                <th>K</th>
                <th>A</th>
                <th>P</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><input type="checkbox" /></td>
                <td>JF_SAL_01</td>
                <td>B2B 영업</td>
                <td>영업 · 판매</td>
                <td>45세트</td>
                <td>22문항</td>
                <td>TBD</td>
              </tr>
              <tr>
                <td><input type="checkbox" /></td>
                <td>JF_STR_03</td>
                <td>PM · PO · 서비스기획</td>
                <td>기획 · 전략</td>
                <td>목업</td>
                <td>목업</td>
                <td>TBD</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="actions">
          <button class="button danger" onclick="confirmDelete('선택한 문항을 삭제하시겠습니까?')">선택 삭제</button>
          <button class="button" onclick="mockSubmit('수정 화면 목업입니다.')">개별 수정</button>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
