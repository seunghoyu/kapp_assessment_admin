<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>코드 관리 | KAPP Admin</title>
    <link rel="stylesheet" href="./assets/admin.css?v=20260526d" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">KAPP Admin</div>
        <div class="account">admin 계정</div>
        <nav class="nav">
          <a href="./content-create.html">콘텐츠 관리 · 문항 생성</a>
          <a href="./content-edit.html">콘텐츠 관리 · 문항 수정</a>
          <a href="./member.html">회원 관리</a>
          <a href="./analytics.html">행동 퍼널</a>
          <a class="active" href="./code-management.html">코드 관리</a>
        </nav>
      </aside>
      <main class="main">
        <div class="page-header">
          <div>
            <h1 class="page-title">코드 관리</h1>
            <p class="page-subtitle">산업군, 직무군, 직무군별 typical_roles 선택값을 관리합니다.</p>
          </div>
        </div>

        <section class="card code-accordion">
          <button class="accordion-trigger" type="button" onclick="toggleCodeSection('industries-section')">
            <span>산업군 관리</span>
          </button>
          <div id="industries-section" class="code-section open">
            <form class="grid code-form industries-form" onsubmit="saveIndustryOption(event)">
              <input id="industry-original-code" type="hidden" />
              <label>산업군 코드<input id="industry-code" placeholder="예: C" maxlength="2" required /></label>
              <label>노출명<input id="industry-short-name" placeholder="예: 제조업" required /></label>
              <label>정렬순서<input id="industry-sort-order" type="number" min="1" placeholder="예: 3" required /></label>
              <div class="actions form-actions">
                <button class="button secondary" type="button" onclick="resetIndustryForm()">초기화</button>
                <button class="button" type="submit">저장</button>
              </div>
            </form>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>산업군 코드</th>
                    <th>노출명</th>
                    <th>정렬순서</th>
                    <th>프론트 드롭다운 표기</th>
                    <th>관리</th>
                  </tr>
                </thead>
                <tbody id="industries-code-body"></tbody>
              </table>
            </div>
          </div>
        </section>

        <section class="card code-accordion">
          <button class="accordion-trigger" type="button" onclick="toggleCodeSection('jobs-section')">
            <span>직무군 관리</span>
          </button>
          <div id="jobs-section" class="code-section">
            <form class="grid job-family-form" onsubmit="saveJobFamily(event)">
              <input id="job-original-id" type="hidden" />
              <label>대분류명<input id="job-major-label" placeholder="예: 기획·전략" required /></label>
              <label>직무군 ID<input id="job-family-id" placeholder="예: JF_STR_03" required /></label>
              <label>그룹 ID<input id="job-family-group-id" placeholder="예: FG_STRATEGY" required /></label>
              <label>직무군명<input id="job-family-name" placeholder="예: PM·PO·상품기획·서비스기획" required /></label>
              <label>typical_roles<textarea id="job-typical-roles" placeholder="한 줄에 하나씩 입력"></textarea></label>
              <div class="actions form-actions">
                <button class="button secondary" type="button" onclick="resetJobFamilyForm()">초기화</button>
                <button class="button" type="submit">저장</button>
              </div>
            </form>
            <div id="job-family-groups" class="job-groups"></div>
          </div>
        </section>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <script src="./assets/admin.js?v=20260526d"></script>
  </body>
</html>
