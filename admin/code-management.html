<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>코드 관리 | KAPP Admin</title>
    <link rel="stylesheet" href="./assets/admin.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">KAPP Admin</div>
        <div class="account">admin 계정</div>
        <nav class="nav">
          <a href="./content-create.html">콘텐츠 관리 · 문항 생성</a>
          <a href="./content-edit.html">콘텐츠 관리 · 문항 수정</a>
          <a href="./member.html">회원 관리</a>
          <a href="./analytics.html">행동 퍼널</a>
          <a class="active" href="./code-management.html">코드 관리</a>
        </nav>
      </aside>
      <main class="main">
        <div class="page-header">
          <div>
            <h1 class="page-title">코드 관리</h1>
            <p class="page-subtitle">직무군과 K영역 산업군 분류 선택값을 추가, 수정, 삭제합니다.</p>
          </div>
        </div>

        <section class="card">
          <div class="section-title-row">
            <div>
              <h2>직무군 선택값</h2>
              <p class="notice">추가한 직무군은 행동 퍼널과 문항 생성의 직무군 드롭다운에 표시됩니다.</p>
            </div>
          </div>
          <form class="grid code-form" onsubmit="saveCodeOption(event, 'jobs')">
            <input id="code-jobs-original" type="hidden" />
            <label>코드<input id="code-jobs-code" placeholder="예: JF_SAL_02" required /></label>
            <label>표시명<input id="code-jobs-label" placeholder="예: 엔터프라이즈 영업" required /></label>
            <div class="actions form-actions">
              <button class="button secondary" type="button" onclick="resetCodeForm('jobs')">초기화</button>
              <button class="button" type="submit">저장</button>
            </div>
          </form>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>코드</th>
                  <th>표시명</th>
                  <th>드롭다운 표기</th>
                  <th>관리</th>
                </tr>
              </thead>
              <tbody id="jobs-code-body"></tbody>
            </table>
          </div>
        </section>

        <section class="card">
          <div class="section-title-row">
            <div>
              <h2>K영역 산업군 분류</h2>
              <p class="notice">추가한 산업군 분류는 문항 생성의 K영역 산업군 분류 드롭다운에 표시됩니다.</p>
            </div>
          </div>
          <form class="grid code-form" onsubmit="saveCodeOption(event, 'industries')">
            <input id="code-industries-original" type="hidden" />
            <label>코드<input id="code-industries-code" placeholder="예: C" required /></label>
            <label>표시명<input id="code-industries-label" placeholder="예: 제조/건설" required /></label>
            <div class="actions form-actions">
              <button class="button secondary" type="button" onclick="resetCodeForm('industries')">초기화</button>
              <button class="button" type="submit">저장</button>
            </div>
          </form>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>코드</th>
                  <th>표시명</th>
                  <th>드롭다운 표기</th>
                  <th>관리</th>
                </tr>
              </thead>
              <tbody id="industries-code-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <script src="./assets/admin.js"></script>
  </body>
</html>
