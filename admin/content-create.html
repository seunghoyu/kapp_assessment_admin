<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>문항 생성 | KAPP Admin</title>
    <link rel="stylesheet" href="./assets/admin.css?v=20260526d" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">KAPP Admin</div>
        <div class="account">admin 계정</div>
        <nav class="nav">
          <div class="nav-group-label">K 영역</div>
          <a href="./k-set-manage.html">세트 · 토픽 관리</a>
          <a href="./k-question-manage.html">문항 관리</a>
          <div class="nav-group-label">A 영역</div>
          <a class="active" href="./content-create.html">문항 생성 (구)</a>
          <a href="./a-question-manage.html">문항 관리</a>
          <a href="./a-type-manage.html">적성 유형 관리</a>
          <a href="./a-mapping-manage.html">유형 매핑 설정</a>
          <div class="nav-group-label">P 영역</div>
          <a href="./p-set-manage.html">문항 세트 관리</a>
          <a href="./p-type-manage.html">패턴 유형 관리</a>
          <div class="nav-group-label">종합 리포트</div>
          <a href="./summary-manage.html">KAP 조합 관리</a>
          <div class="nav-group-label">운영</div>
          <a href="./member.html">회원 관리</a>
          <a href="./analytics.html">행동 퍼널</a>
          <a href="./code-management.html">코드 관리</a>
          <a href="./orders.html">주문 관리</a>
        </nav>
      </aside>
      <main class="main">
        <h1 class="page-title">문항 생성</h1>
        <p class="page-subtitle">테스트 환경에서는 저장 동작을 목업으로 처리합니다.</p>

        <div class="tabs">
          <button class="tab active" onclick="switchContentTab('k', this)">K영역</button>
          <button class="tab" onclick="switchContentTab('a', this)">A영역</button>
          <button class="tab" onclick="mockSubmit('P영역 문항 양식은 준비 중입니다.')">P영역 TBD</button>
        </div>

        <section class="card" id="content-tab-k">
          <h2>K영역 개별 입력</h2>
          <div class="grid">
            <label>직무군<select id="content-k-job"></select></label>
            <label>산업군 분류<select id="content-k-industry"></select></label>
            <label>세트 번호<input placeholder="예: 1" /></label>
            <label>세트명<input placeholder="예: 고객 발굴 · 접근" /></label>
            <label>문항 1 입력 단위<input /></label>
            <label>문항 1 정답<input /></label>
          </div>
          <div class="actions">
            <button class="button secondary" onclick="mockSubmit('K_template.xlsx 다운로드 목업입니다.')">양식 다운로드</button>
            <button class="button" onclick="mockSubmit('K영역 문항이 등록되었습니다.')">등록</button>
          </div>
        </section>

        <section class="card" id="content-tab-a" style="display:none">
          <h2>A영역 개별 입력</h2>
          <div class="grid">
            <label>직무군<select id="content-a-job"></select></label>
            <label>직급<input placeholder="대리" /></label>
            <label>문항 번호<input placeholder="1" /></label>
            <label>트리거 유형<input placeholder="정보 부족 / 갈등 / 우선순위" /></label>
          </div>
          <label class="stacked">문항 본문<textarea></textarea></label>
          <div class="actions">
            <button class="button secondary" onclick="mockSubmit('A_template.xlsx 다운로드 목업입니다.')">양식 다운로드</button>
            <button class="button" onclick="mockSubmit('A영역 문항이 등록되었습니다.')">등록</button>
          </div>
        </section>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <script src="./assets/admin.js?v=20260526d"></script>
  </body>
</html>
